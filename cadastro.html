<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/linus.png">
    <nav>
        <a href="index.html"> Home Page</a>
    </nav>
</head>
<body>
    <form id="formCadastro">
        <label for="">Nome do Jogador: </label>
        <input type="text" name="nome da pessoa" id="nomeUser">
        <br>
        <label for="">Função: </label>
        <input type="text" name="funcao" id="funcaoUser">
        <br>
        <label for="">Pontuação:</label>
        <input type="number" name="pontuacao" id="pointsUser">
        <br>
        <label>Status: </label>
        <br>
        <label for="statusjogador">Ativo</label>
        <input type="radio" name="statusjogador" id="statusAtivo">
        <label for="statusjogador">Inativo</label>
        <input type="radio" name="statusjogador" id="statusInativo">
        <br>
        <button type="submit">Enviar</button>
    </form>
    <script src="app-web.js"></script>
</body>
</html>
