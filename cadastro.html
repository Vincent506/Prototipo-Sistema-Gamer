<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/linus.png">
    <nav>
        <a href="index.html"> Home Page</a>
    </nav>
</head>
<body>
    <form action="" method="GET">
        <label for="">Nome do Jogador: </label>
        <input type="text" name="nome da pessoa" id="nomeUser">
        <br>
        <label for="">Função: </label>
        <input type="text" name="funcao" id="funcaoUser">
        <br>
        <label for="">Pontuação:</label>
        <input type="number" name="pontuacao" id="pointsUser">
        <br>
        <label for="">Status: </label>
        <br>
        <label for="">Ativo</label>
        <input type="checkbox" name="Ativo" id="verdadeiro">
        <label for="">Inativo</label>
        <input type="checkbox" name="Inativo" id="falso">
    </form>
    <button type="submit" >Enviar</button>
</body>
</html>
